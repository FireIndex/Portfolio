<!DOCTYPE html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>All Work — Sundram Kumar</title>
    <meta
      name="description"
      content="Complete project catalogue — backend services, machine learning, data visualisation and web applications by Sundram Kumar."
    />
    <meta name="author" content="Sundram Kumar" />
    <meta name="theme-color" content="#faf8f4" />
    <link rel="canonical" href="https://example.com/work.html" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sundram Kumar" />
    <meta property="og:title" content="All Work — Sundram Kumar" />
    <meta
      property="og:description"
      content="Complete project catalogue — backend services, machine learning, data visualisation and web applications."
    />
    <meta property="og:url" content="https://example.com/work.html" />
    <meta property="og:image" content="https://example.com/assets/og.svg" />
    <meta property="og:image:alt" content="Sundram Kumar — portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="All Work — Sundram Kumar" />
    <meta
      name="twitter:description"
      content="Complete project catalogue — backend services, machine learning, data visualisation and web applications."
    />
    <meta name="twitter:image" content="https://example.com/assets/og.svg" />

    <!-- Icons -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="assets/favicon-256.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/favicon-256.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- ================= NAVIGATION ================= -->
    <header class="nav" id="nav">
      <div class="shell nav__inner">
        <a class="nav__brand" href="index.html" data-brand>Sundram Kumar</a>

        <button
          class="nav__toggle"
          id="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Toggle navigation"
        >
          <span></span>
        </button>

        <div class="nav__menu" id="nav-menu">
          <nav aria-label="Primary">
            <ul class="nav__list" data-nav-list></ul>
          </nav>
          <p class="status nav__status" data-status>
            <span class="status__dot" aria-hidden="true"></span>
            <span data-status-label>Open to opportunities</span>
          </p>
        </div>
      </div>
    </header>

    <main id="main">
      <!-- ================= CATALOGUE ================= -->
      <section class="section section--flush catalogue" aria-labelledby="cat-title">
        <div class="shell grid">
          <p class="mono catalogue__label" data-cat-label></p>

          <h1 class="catalogue__title" id="cat-title">All work</h1>

          <p class="catalogue__intro" data-cat-intro></p>

          <!-- Grouped lists are generated here -->
          <div class="catalogue__groups" data-catalogue></div>

          <p class="catalogue__back">
            <a class="work__more-link" href="index.html">
              <svg
                class="btn__arrow btn__arrow--back"
                width="13"
                height="13"
                viewBox="0 0 14 14"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M11.5 7h-9M6 3.5L2.5 7 6 10.5"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Back to home
            </a>
          </p>
        </div>
      </section>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
      <div class="shell footer__inner">
        <span data-footer-left></span>
        <span class="footer__stamp" data-footer-stamp></span>
        <span class="footer__right" data-footer-right></span>
      </div>
    </footer>

    <script src="data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
