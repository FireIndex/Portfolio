<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-label="Plain input passes through a salted deterministic shuffle and then a Caesar shift to produce masked output, with a dashed return path showing the transformation is reversible.">
  <rect width="800" height="500" fill="#f0ece3"/>
  <g font-family="monospace" font-size="11" letter-spacing="1.4" fill="#6b6559">
    <text x="48" y="58">INPUT</text>
    <text x="286" y="58">LAYERED MASK</text>
    <text x="628" y="58">OUTPUT</text>
  </g>
  <rect x="48" y="196" width="164" height="60" rx="4" fill="#faf8f4" stroke="#d3ccbe"/>
  <text x="66" y="232" font-family="monospace" font-size="13" fill="#23211d">9540291360</text>
  <path d="M212 226 H286" stroke="#455946" stroke-width="1.5"/>
  <rect x="286" y="146" width="150" height="72" rx="4" fill="#faf8f4" stroke="#455946" stroke-width="1.5"/>
  <text x="304" y="176" font-family="monospace" font-size="11" fill="#23211d">shuffle</text>
  <text x="304" y="196" font-family="monospace" font-size="10" fill="#455946">+ salt</text>
  <path d="M361 218 V236" stroke="#455946" stroke-width="1.5"/>
  <rect x="286" y="236" width="150" height="72" rx="4" fill="#faf8f4" stroke="#455946" stroke-width="1.5"/>
  <text x="304" y="266" font-family="monospace" font-size="11" fill="#23211d">caesar</text>
  <text x="304" y="286" font-family="monospace" font-size="10" fill="#455946">shift</text>
  <path d="M436 272 C520 272 540 226 628 226" stroke="#455946" stroke-width="1.5" fill="none"/>
  <rect x="628" y="196" width="124" height="60" rx="4" fill="#faf8f4" stroke="#455946"/>
  <text x="644" y="232" font-family="monospace" font-size="13" fill="#23211d">c1e8f3a02b</text>
  <path d="M690 256 C690 344 130 344 130 262" stroke="#6b7f6b" stroke-width="1.5"
        fill="none" stroke-dasharray="5 4"/>
  <path d="M130 266 l-4.5 -9 h9 z" fill="#6b7f6b"/>
  <text x="326" y="366" font-family="monospace" font-size="10" fill="#455946">deterministic · reversible</text>
  <path d="M48 412H752" stroke="#d3ccbe"/>
  <g font-family="monospace" font-size="11" letter-spacing="1.2" fill="#455946">
    <text x="48" y="440">ZERO DEPENDENCIES</text>
    <text x="646" y="440">ON PyPI</text>
  </g>
</svg>
