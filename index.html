<!DOCTYPE html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Sundram Kumar — Backend &amp; Quantitative Python Engineer</title>
    <meta
      name="description"
      content="Backend and quantitative Python engineer building real-time trading infrastructure, low-latency data pipelines and distributed services."
    />
    <meta name="author" content="Sundram Kumar" />
    <meta name="theme-color" content="#faf8f4" />
    <link rel="canonical" href="https://fireindex.github.io/Portfolio/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sundram Kumar" />
    <meta property="og:title" content="Sundram Kumar — Backend &amp; Quantitative Python Engineer" />
    <meta
      property="og:description"
      content="Backend and quantitative Python engineer building real-time trading infrastructure, low-latency data pipelines and distributed services."
    />
    <meta property="og:url" content="https://fireindex.github.io/Portfolio/" />
    <meta property="og:image" content="https://fireindex.github.io/Portfolio/assets/og.svg" />
    <meta property="og:image:alt" content="Sundram Kumar — portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sundram Kumar — Backend &amp; Quantitative Python Engineer" />
    <meta
      name="twitter:description"
      content="Building intelligent systems at the intersection of data, machine learning and software."
    />
    <meta name="twitter:image" content="https://fireindex.github.io/Portfolio/assets/og.svg" />

    <!-- Icons -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="assets/favicon-256.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/favicon-256.png" />

    <!-- Fonts: preconnect so the @import in CSS resolves faster -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="styles.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sundram Kumar",
        "jobTitle": "Quantitative Python Developer",
        "url": "https://fireindex.github.io/Portfolio/",
        "address": { "@type": "PostalAddress", "addressCountry": "IN" },
        "knowsAbout": [
          "Backend Engineering",
          "Distributed Systems",
          "Real-Time Data Streaming",
          "Algorithmic Trading Infrastructure",
          "Data Analysis"
        ],
        "email": "sundramkumar8298@gmail.com",
        "sameAs": [
          "https://github.com/FireIndex",
          "https://www.linkedin.com/in/sundram8298/"
        ]
      }
    </script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- ================= NAVIGATION ================= -->
    <header class="nav" id="nav">
      <div class="shell nav__inner">
        <a class="nav__brand" href="#top" data-brand>Sundram Kumar</a>

        <button
          class="nav__toggle"
          id="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Toggle navigation"
        >
          <span></span>
        </button>

        <div class="nav__menu" id="nav-menu">
          <nav aria-label="Primary">
            <ul class="nav__list" data-nav-list></ul>
          </nav>
          <p class="status nav__status" data-status>
            <span class="status__dot" aria-hidden="true"></span>
            <span data-status-label>Available for opportunities</span>
          </p>
        </div>
      </div>
    </header>

    <main id="main">
      <!-- ================= HERO ================= -->
      <section class="hero" id="top" aria-labelledby="hero-headline">
        <div class="hero__lines" aria-hidden="true"></div>
        <div class="shell grid hero__inner">
          <p class="mono hero__label" data-hero-label></p>

          <h1 class="hero__headline" id="hero-headline" data-hero-headline></h1>

          <div class="hero__intro">
            <p data-hero-intro></p>
          </div>

          <div class="hero__side">
            <div class="hero__actions" data-hero-actions></div>
            <ul class="hero__meta" data-hero-meta></ul>
          </div>
        </div>
      </section>

      <!-- ================= ABOUT ================= -->
      <section class="section" id="about" aria-labelledby="about-title">
        <div class="shell grid">
          <div class="sec-head reveal">
            <span class="sec-head__num" data-section-num></span>
            <h2 class="sec-head__title" id="about-title" data-about-title></h2>
          </div>

          <figure class="about__quote reveal">
            <blockquote data-about-quote></blockquote>
          </figure>

          <div class="about__body reveal" data-about-body></div>

          <div class="about__lists reveal">
            <div class="about__list">
              <h3 class="mono" data-about-focus-label></h3>
              <ul data-about-focus></ul>
            </div>
            <div class="about__list">
              <h3 class="mono" data-about-expertise-label></h3>
              <ul data-about-expertise></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- ================= WORK ================= -->
      <section class="section" id="work" aria-labelledby="work-title">
        <div class="shell grid">
          <div class="sec-head reveal">
            <span class="sec-head__num" data-section-num></span>
            <h2 class="sec-head__title" id="work-title" data-work-title></h2>
            <span class="sec-head__meta" data-work-count></span>
          </div>

          <p class="work__intro reveal" data-work-intro></p>

          <div class="projects" data-projects></div>

          <p class="work__more" data-work-more></p>
        </div>
      </section>

      <!-- ================= SKILLS ================= -->
      <section class="section" id="skills" aria-labelledby="skills-title">
        <div class="shell grid">
          <div class="sec-head reveal">
            <span class="sec-head__num" data-section-num></span>
            <h2 class="sec-head__title" id="skills-title" data-skills-title></h2>
          </div>

          <p class="skills__intro reveal" data-skills-intro></p>

          <div class="skills__groups" data-skills></div>
        </div>
      </section>

      <!-- ================= EXPERIENCE ================= -->
      <section class="section" id="experience" aria-labelledby="experience-title">
        <div class="shell grid">
          <div class="sec-head reveal">
            <span class="sec-head__num" data-section-num></span>
            <h2
              class="sec-head__title"
              id="experience-title"
              data-exp-title
            ></h2>
          </div>

          <div class="timeline" data-timeline></div>
        </div>
      </section>

      <!-- ================= EDUCATION ================= -->
      <section class="section" id="education" aria-labelledby="education-title">
        <div class="shell grid">
          <div class="sec-head reveal">
            <span class="sec-head__num" data-section-num></span>
            <h2 class="sec-head__title" id="education-title" data-edu-title></h2>
          </div>

          <div class="education__list" data-education></div>
        </div>
      </section>

      <!-- ================= CONTACT ================= -->
      <section class="section contact" id="contact" aria-labelledby="contact-title">
        <div class="shell grid">
          <div class="sec-head reveal">
            <span class="sec-head__num" data-section-num></span>
            <h2 class="sec-head__title" data-contact-title></h2>
          </div>

          <h3
            class="contact__heading reveal"
            id="contact-title"
            data-contact-heading
          ></h3>

          <p class="contact__text reveal" data-contact-text></p>

          <a class="contact__email reveal" data-contact-email href="#">
            <span data-contact-email-text></span>
            <svg
              class="arrow"
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M5 15L15 5M15 5H7M15 5v8"
                stroke="currentColor"
                stroke-width="1.25"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>

          <ul class="contact__profiles reveal" data-profiles></ul>
        </div>
      </section>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
      <div class="shell footer__inner">
        <span data-footer-left></span>
        <span class="footer__stamp" data-footer-stamp></span>
        <span class="footer__right" data-footer-right></span>
      </div>
    </footer>

    <script src="data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
